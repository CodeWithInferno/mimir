name: Bug report
description: Something Mimir does is wrong, crashes, or differs from the documentation
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A report that can be reproduced gets fixed. For a security problem do not use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got. Paste the exact output (stdout and stderr).
      placeholder: |
        bin/mimir check my.scene.js --text
        expected: OK 0 errors
        got: ...
    validations:
      required: true
  - type: textarea
    id: scene
    attributes:
      label: Smallest scene that shows it
      description: Paste the scene file, cut down as far as you can. If an example in this repository shows it, name the example instead.
      render: javascript
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command
      options:
        - check
        - shot
        - open
        - export
        - docs
        - new
        - query
        - build or tests
        - the viewer in the browser
        - an exported HTML file
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mimir version or commit
      description: Output of `bin/mimir --version` and `git rev-parse --short HEAD`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: macOS 15.5 arm64 / Ubuntu 24.04 x64 / ...
    validations:
      required: true
  - type: input
    id: bun
    attributes:
      label: bun version
      description: Output of `bun --version`
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser used by Mimir
      description: Name and version of the Chrome-family browser, and whether MIMIR_CHROME is set
      placeholder: Google Chrome 142.0.x, MIMIR_CHROME not set
    validations:
      required: true
  - type: textarea
    id: frames
    attributes:
      label: Frames, if it is about what is drawn
      description: Attach the PNG from `bin/mimir shot <scene> --sheet` and say what is wrong in it. Include the sha256 from the manifest if the problem is that two runs differ.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues
          required: true
        - label: The report contains no secret and no private file
          required: true
